name: Build Abdul Ahad Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore offline website and app icon
        run: |
          mkdir -p android-apk/app/src/main/assets android-apk/app/src/main/res/drawable
          { head -c 9000 android-apk/compact.xz.b64; cat android-apk/compact.fix9.b64; tail -c +10001 android-apk/compact.xz.b64; } | tr -d '\n\r ' | base64 -d | xz -d > android-apk/app/src/main/assets/index.html
          tr -d '\n\r ' < android-apk/photo.b64 | base64 -d > android-apk/app/src/main/assets/photo.jpg
          cp android-apk/app/src/main/assets/photo.jpg android-apk/app/src/main/res/drawable/app_icon.jpg
          test -s android-apk/app/src/main/assets/index.html
          test -s android-apk/app/src/main/assets/photo.jpg
          test -s android-apk/app/src/main/res/drawable/app_icon.jpg

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build unsigned release APK
        run: gradle -p android-apk :app:assembleRelease

      - name: Generate private release signing key
        shell: bash
        run: |
          mkdir -p private-signing-backup release-output
          PASS=$(openssl rand -hex 24)
          echo "::add-mask::$PASS"
          keytool -genkeypair -noprompt \
            -keystore private-signing-backup/Abdul_Ahad_Pathshala_Release.jks \
            -storetype JKS \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias abdul-ahad-pathshala \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Abdul Ahad, OU=Pathshala, O=Abdul Ahad, L=Dhaka, ST=Dhaka, C=BD"
          printf "KEEP THIS FILE PRIVATE AND SAFE.\n\nApp: Abdul Ahad Pathshala\nPackage: com.abdulahad.pathshala\nAlias: abdul-ahad-pathshala\nKeystore password: %s\nKey password: %s\n\nThis same keystore is required to publish future updates over this APK.\n" "$PASS" "$PASS" > private-signing-backup/KEEP_PRIVATE_SIGNING_DETAILS.txt
          echo "SIGNING_PASS=$PASS" >> "$GITHUB_ENV"

      - name: Align and cryptographically sign APK
        shell: bash
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="android-apk/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" release-output/app-release-aligned.apk
          "$BT/apksigner" sign \
            --ks private-signing-backup/Abdul_Ahad_Pathshala_Release.jks \
            --ks-key-alias abdul-ahad-pathshala \
            --ks-pass "pass:$SIGNING_PASS" \
            --key-pass "pass:$SIGNING_PASS" \
            --out release-output/Abdul_Ahad_Pathshala_v2.apk \
            release-output/app-release-aligned.apk
          rm release-output/app-release-aligned.apk

      - name: Verify signature identity and permissions
        shell: bash
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK="release-output/Abdul_Ahad_Pathshala_v2.apk"
          {
            echo "ABDUL AHAD PATHSHALA - APK SECURITY REPORT"
            echo "=========================================="
            echo
            echo "SIGNATURE VERIFICATION"
            "$BT/apksigner" verify --verbose --print-certs "$APK"
            echo
            echo "PACKAGE / VERSION"
            "$BT/aapt" dump badging "$APK" | head -n 8
            echo
            echo "DECLARED PERMISSIONS"
            "$BT/aapt" dump permissions "$APK"
            echo
            echo "SHA-256"
            sha256sum "$APK"
          } > release-output/APK_SECURITY_REPORT.txt
          "$BT/apksigner" verify "$APK"
          if "$BT/aapt" dump permissions "$APK" | grep -q "android.permission.INTERNET"; then
            echo "Unexpected INTERNET permission found" >&2
            exit 1
          fi

      - name: Upload installable signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Abdul_Ahad_Pathshala_v2_APK
          path: release-output/
          retention-days: 90

      - name: Upload private signing backup
        uses: actions/upload-artifact@v4
        with:
          name: Abdul_Ahad_Pathshala_Signing_Backup_PRIVATE
          path: private-signing-backup/
          retention-days: 90
