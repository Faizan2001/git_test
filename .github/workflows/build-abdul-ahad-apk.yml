name: Build Abdul Ahad APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore offline website
        run: |
          tr -d '\n\r ' < android-apk/compact.xz.b64 | base64 -d | xz -d > android-apk/app/src/main/assets/index.html
          tr -d '\n\r ' < android-apk/photo.b64 | base64 -d > android-apk/app/src/main/assets/photo.jpg
          test -s android-apk/app/src/main/assets/index.html
          test -s android-apk/app/src/main/assets/photo.jpg

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle -p android-apk :app:assembleDebug

      - name: Prepare APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk Abdul_Ahad_Pathshala.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abdul_Ahad_Pathshala_APK
          path: Abdul_Ahad_Pathshala.apk
